<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bản khung Banqi với 32 ô úp, tọa độ a1–h4, hướng ngang/dọc và giao diện sáng/tối.">
    <title>Banqi — Bản khung</title>
    <!-- Apply the saved/system theme before the stylesheet and page content. -->
    <script src="./js/app.js"></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Cờ tướng lật · R0-02</p>
        <div class="header-toolbar">
          <h1>Banqi</h1>
          <div class="theme-controls" role="group" aria-label="Giao diện sáng/tối">
            <button type="button" data-theme="light" aria-pressed="false"><span class="selection-mark" aria-hidden="true">✓</span>Sáng</button>
            <button type="button" data-theme="dark" aria-pressed="false"><span class="selection-mark" aria-hidden="true">✓</span>Tối</button>
          </div>
        </div>
        <p class="notice">Bản khung — chưa chơi được.</p>
        <p>32 ô úp để kiểm tra cách hiển thị bàn cờ. Chưa có thao tác lật, đi hoặc ăn quân.</p>
      </header>

      <section aria-labelledby="board-heading">
        <div class="board-toolbar">
          <h2 id="board-heading">Bàn cờ</h2>
          <div class="orientation-controls" role="group" aria-label="Hướng bàn cờ">
            <button type="button" data-orientation="horizontal" aria-pressed="true" aria-controls="board"><span class="selection-mark" aria-hidden="true">✓</span>Ngang</button>
            <button type="button" data-orientation="vertical" aria-pressed="false" aria-controls="board"><span class="selection-mark" aria-hidden="true">✓</span>Dọc</button>
          </div>
        </div>
        <p id="board-status" class="board-status" role="status">Ngang · 8 cột × 4 hàng</p>
        <div id="board-shell" class="board-shell" data-orientation="horizontal">
          <div id="axis-left" class="axis axis-left" aria-hidden="true"></div>
          <ol id="board" class="board" data-orientation="horizontal" aria-label="32 ô úp, tọa độ a1 đến h4" role="list"></ol>
          <div id="axis-bottom" class="axis axis-bottom" aria-hidden="true"></div>
        </div>
        <p class="board-help">Tọa độ a1–h4 giữ nguyên khi đổi hướng bàn.</p>
        <noscript><p>Hãy bật JavaScript để xem 32 ô và chuyển hướng bàn cờ.</p></noscript>
      </section>
    </main>
  </body>
</html>
